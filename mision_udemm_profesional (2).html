<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031628">
  <title>Misión UdeMM | Elegí tu próximo desafío</title>
  <style>
    :root {
      --navy-dark: #031628;
      --navy-panel: #072848;
      --navy-card: #0b3864;
      --blue-bright: #0878b9;
      --cyan: #42c6d9;
      --gold: #ffc857;
      --white: #ffffff;
      --text-muted: #83a4c4;
      --success: #147d64;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--navy-dark);
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: linear-gradient(180deg, #041d33 0%, #020f1c 100%);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex-grow: 1;
      animation: fadeIn 0.3s ease-in-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px 0 20px;
    }

    .title-main {
      font-size: 2.3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .title-main span {
      color: var(--cyan);
    }

    .subtitle-main {
      font-size: 1rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
    }

    .card-panel {
      background: rgba(7, 40, 72, 0.6);
      border: 1px solid rgba(66, 198, 217, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .btn-action {
      background: var(--blue-bright);
      color: var(--white);
      border: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: auto;
    }

    .btn-action:active {
      background: #065e92;
    }
  </style>
</head>
<body>

  <main>
    <!-- PANTALLA 1: BIENVENIDA -->
    <section class="screen active" id="screen-welcome">
      <div class="brand-logo">
        <!-- Acá irá el logo de UdeMM -->
        <div style="font-weight: 800; font-size: 1.2rem; color: var(--cyan);">UdeMM</div>
      </div>
      
      <h1 class="title-main">MISIÓN<br><span>UdEMM</span></h1>
      <p class="subtitle-main">Elegí tu próximo desafío. Resolvé, aprendé, descubrí qué carreras se conectan con vos.</p>
      
      <button class="btn-action" onclick="alert('¡Pronto programaremos la siguiente pantalla!')">
        COMENZAR →
      </button>
    </section>
  </main>

</body>
</html>
