<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031628">
  <title>Misión UdeMM | Elegí tu próximo desafío</title>
  <style>
    :root {
      --navy-dark: #031628;
      --navy-panel: #072848;
      --navy-card: #0b3864;
      --blue-bright: #0878b9;
      --cyan: #42c6d9;
      --gold: #ffc857;
      --white: #ffffff;
      --text-muted: #83a4c4;
      --success: #147d64;
      --error: #c94a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--navy-dark);
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: linear-gradient(180deg, #041d33 0%, #020f1c 100%);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex-grow: 1;
      animation: fadeIn 0.3s ease-in-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }

    .title-main {
      font-size: 2.3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .title-main span {
      color: var(--cyan);
    }

    .subtitle-main {
      font-size: 1rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .screen-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 15px 0 5px 0;
    }

    .screen-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .mission-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      font-weight: 600;
    }

    .btn-action {
      background: var(--blue-bright);
      color: var(--white);
      border: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 15px;
    }

    .btn-action:active {
      background: #065e92;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--white);
      font-size: 1.2rem;
      cursor: pointer;
      align-self: flex-start;
      margin-bottom: 10px;
    }

    .mission-card {
      background: rgba(11, 56, 100, 0.4);
      border: 1px solid rgba(66, 198, 217, 0.15);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mission-card:hover {
      border-color: var(--cyan);
      background: rgba(11, 56, 100, 0.7);
    }

    .mission-info {
      padding-right: 10px;
    }

    .mission-tag {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: block;
    }

    .mission-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .mission-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .mission-arrow {
      color: var(--cyan);
      font-weight: bold;
      font-size: 1.1rem;
    }

    .scenario-card {
      background: rgba(7, 40, 72, 0.6);
      border-left: 4px solid var(--cyan);
      padding: 15px;
      border-radius: 4px 14px 14px 4px;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .choice-box {
      background: var(--navy-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: center;
      transition: all 0.2s;
      line-height: 1.3;
      width: 100%;
      text-align: left;
      color: var(--white);
    }

    .choice-letter {
      background: rgba(255, 255, 255, 0.1);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .choice-box.correct-selected {
      border-color: var(--success);
      background: rgba(20, 125, 100, 0.3);
    }

    .choice-box.wrong-selected {
      border-color: var(--error);
      background: rgba(201, 74, 74, 0.3);
    }

    .feedback-box {
      display: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .feedback-box.correct {
      display: block;
      background: rgba(20, 125, 100, 0.2);
      border: 1px solid var(--success);
      color: #9bf0db;
    }

    .feedback-box.wrong {
      display: block;
      background: rgba(201, 74, 74, 0.2);
      border: 1px solid var(--error);
      color: #ffb3b3;
    }

    .success-icon {
      font-size: 3.5rem;
      color: #9bf0db;
      text-align: center;
      margin: 15px 0;
    }

    /* ESTILOS DE TUS CAPTURAS */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .skill-block {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 10px;
    }
    .skill-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
    }
    .skill-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .academic-route {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 12px 0;
    }
    .route-number {
      color: var(--gold);
      font-weight: 800;
      font-size: 1.1rem;
      margin-right: 5px;
    }
    .route-faculty {
      font-size: 0.75rem;
      color: var(--cyan);
      font-weight: 700;
      text-transform: uppercase;
    }
    .route-name {
      font-size: 1rem;
      font-weight: 700;
      margin: 2px 0;
    }
    .route-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--white);
    }
    .form-control {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px;
      color: var(--white);
      font-family: inherit;
    }
    .form-checkbox {
      display: flex;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 15px 0;
      line-height: 1.3;
    }
    .faculties-container {
      margin-top: 25px;
      background: rgba(7, 40, 72, 0.3);
      padding: 15px;
      border-radius: 12px;
    }
    .faculty-section {
      margin-bottom: 15px;
    }
    .faculty-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--cyan);
      border-bottom: 1px solid rgba(66, 198, 217, 0.3);
      padding-bottom: 3px;
      margin-bottom: 6px;
    }
    .faculty-item {
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 2px 0;
    }
  </style>
</head>
<body>

  <main>
    <!-- PANTALLA 1: BIENVENIDA -->
    <section class="screen active" id="screen-welcome">
      <div class="brand-logo">
        <div style="font-weight: 800; font-size: 1.2rem; color: var(--cyan);">UdeMM</div>
      </div>
      <h1 class="title-main">MISIÓN<br><span>UdEMM</span></h1>
      <p class="subtitle-main">Elegí tu próximo desafío. Resolvé, aprendé, descubrí qué carreras se conectan con vos.</p>
      <button class="btn-action" onclick="cambiarPantalla('screen-missions')">COMENZAR →</button>
    </section>

    <!-- PANTALLA 2: LAS MISIONES -->
    <section class="screen" id="screen-missions">
      <button class="btn-back" onclick="cambiarPantalla('screen-welcome')">←</button>
      <h2 class="screen-title">Tu misión</h2>
      <p class="screen-desc">¿Qué tipo de desafío te gustaría resolver hoy?</p>
      
      <div class="mission-card" onclick="iniciarMision(1)">
        <div class="mission-info">
          <span class="mission-tag">Misión 1</span>
          <div class="mission-name">Operación en marcha</div>
          <div class="mission-desc">Organización y logística.</div>
        </div>
        <div class="mission-arrow">→</div>
      </div>

      <div class="mission-card" onclick="iniciarMision(2)">
        <div class="mission-info">
          <span class="mission-tag">Misión 2</span>
          <div class="mission-name">Decisión estratégica</div>
          <div class="mission-desc">Análisis y gestión empresarial.</div>
        </div>
